<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PZ Server Manager</title>
    <!-- Importamos HTMX desde el CDN oficial -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Un poco de CSS en línea para no complicarnos por ahora -->
    <style>
        body { font-family: system-ui, sans-serif; background-color: #1a1a1a; color: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #2c2c2c; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border-radius: 4px; border: none;}
        button { background-color: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        .error { color: #ff6b6b; font-size: 0.9em; }
    </style>
</head>
<body>
	<header>
		<h1>🧟 RFG Zomboid</h1>
	</header>
    <div class="container">
        
        <!-- EL CORAZÓN DE LA SPA: Este div será reemplazado dinámicamente por HTMX -->
        <div id="main-content">
            <!-- Usamos un tag de Django para incluir el partial inicial (login o dashboard) -->
            {% include initial_partial %}
        </div>
    </div>

</body>
</html>
